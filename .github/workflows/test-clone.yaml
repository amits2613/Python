name: 'testing clone commit'

on:
  push:
    branches: 
    - 'dev'
    paths:
      - 'overlays/prod/**/*'

jobs:
  sync-image-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # - name: Install yq
      #   run: |
      #     sudo add-apt-repository ppa:rmescandon/yq
      #     sudo apt update
      #     sudo apt install yq -y

      - name: Extract image tag 
        id: extract_tag
        working-directory: ./overlays/prod
        run: |
          # Extract the image tag from dev.values.yaml
          IMAGE_TAG=$(yq eval '.api.image.tag' prod.values.yaml)
          echo "Image Tag: $IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update image tag to prod clone values.yaml
        working-directory: ./overlays/prod
        run: |
          yq eval ".api.image.tag = \"$IMAGE_TAG\"" -i prod.new.values.yaml

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: dev
          commit_message: 'Automated image tag update'
          file_pattern: '*.values.yaml'
